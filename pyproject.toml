[project]
name = "ant-colony"
version = "0.1.0"
description = "A deterministic ant colony environment simulation"
readme = "README.md"
requires-python = ">=3.13,<3.14"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
line-ending = "lf"