[project]
name = "terroir-simulator"
version = "0.1.0"
description = "A deterministic ecosystem environment simulation"
readme = "README.md"
requires-python = ">=3.13,<3.14"

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.16.0",
    "mypy==1.18.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
files = ["src/terroir_simulator"]
strict = true
pretty = true
show_error_codes = true
exclude = "(^build/|^dist/|^\\.venv/|^venv/|^\\.mypy_cache/|^__pycache__/)"